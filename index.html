<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f0fc">
<title>Cnation App</title>

<!-- PWA manifest -->
<link rel="manifest" href="./manifest.json">

<!-- Favicon -->
<link rel="icon" href="./favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="./icons/favicon-16x16.png">

<!-- iOS: 홈 화면에 추가 시 전체화면(standalone)으로 실행 -->
<meta name="apple-mobile-web-app-capable" content="yes">

<!-- Android/Chrome: 홈 화면에 추가 시 전체화면(standalone)으로 실행 -->
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg-top:#eef0fb;--bg-bottom:#f8f9fd;--panel:#ffffff;--line:#edeff7;--text:#182238;--muted:#7c8598;--purple1:#8a3ffc;--purple2:#5b3df5;--radius:20px;--shadow:0 12px 28px rgba(31,41,64,.07)}
*{box-sizing:border-box}html{background:var(--bg-top)}body{margin:0;min-height:100vh;color:var(--text);background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 55%,#f9fafc 100%);font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.shell{width:min(100%,820px);min-height:100vh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;padding:20px 22px;border-radius:26px;background:linear-gradient(120deg,var(--purple1) 0%,#7148f6 45%,var(--purple2) 100%);box-shadow:0 16px 32px rgba(90,60,240,.28)}.brand-small{margin:0 0 4px;color:rgba(255,255,255,.78);font-size:11px;font-weight:800;letter-spacing:.13em}h1{margin:0;color:#fff;font-size:26px;line-height:1.15;letter-spacing:-.03em}.header-home{display:none;width:42px;height:42px;flex-shrink:0;border:1px solid rgba(255,255,255,.35);border-radius:14px;background:rgba(255,255,255,.16);color:#fff;cursor:pointer;font-size:19px}.header-home.show{display:grid;place-items:center}
#homeView{display:none}#homeView.active{display:block}#detailView{display:none}#detailView.active{display:block}.intro{margin:0 0 15px;color:var(--muted);font-size:14px;line-height:1.6}.intro a{color:var(--purple2);text-decoration:none}.search-area{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;margin-bottom:14px}#searchInput{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:15px;outline:none;background:rgba(255,255,255,.95);color:var(--text);box-shadow:0 8px 20px rgba(31,41,64,.06);backdrop-filter:blur(14px)}#searchInput::placeholder{color:#a7aec2}
.info-banner{display:flex;align-items:center;gap:10px;margin-bottom:22px;padding:13px 15px;border-radius:16px;background:#f1eefc;color:#5b3df5;font-size:12.5px;font-weight:700;line-height:1.5}.info-banner .dot{flex-shrink:0;width:22px;height:22px;border-radius:50%;background:#5b3df5;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.category{margin-bottom:26px}.category-title{display:flex;align-items:center;gap:8px;margin:0 0 11px;color:#1e2a44;font-size:13px;font-weight:800;letter-spacing:.06em}.app-list{display:grid;gap:12px}
.app-item{border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);box-shadow:var(--shadow);padding:15px 15px 16px;transition:.14s ease}
.app-main{display:grid;grid-template-columns:52px minmax(0,1fr) 16px;gap:12px;align-items:center;cursor:pointer;background:none;border:0;width:100%;padding:0;text-align:left;color:inherit}
.app-icon{width:52px;aspect-ratio:1;display:grid;place-items:center;border-radius:15px;font-size:25px}
.app-text{min-width:0}.app-name{display:block;margin-bottom:3px;font-size:15px;font-weight:800;line-height:1.35;color:var(--text)}.app-desc{display:-webkit-box;overflow:hidden;color:var(--muted);font-size:12px;line-height:1.5;-webkit-line-clamp:2;-webkit-box-orient:vertical}.arrow{color:#c3c9da;font-size:20px}
.launch-row{display:grid;grid-template-columns:1fr;gap:8px;margin-top:13px}
.quick-btn{min-height:44px;padding:10px 10px;border:0;border-radius:13px;color:#fff;font-size:13px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;box-shadow:0 8px 16px rgba(0,0,0,.1)}.quick-btn.outline{background:#fff!important;box-shadow:none;border:1.5px solid currentColor}
.empty{display:none;padding:28px 16px;border:1px dashed var(--line);border-radius:17px;color:var(--muted);text-align:center;font-size:14px;background:#fff}.empty.show{display:block}
.back-btn{margin:0 0 12px;padding:7px 0;border:0;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.detail-card{padding:20px;border:1px solid var(--line);border-radius:26px;background:var(--panel);box-shadow:var(--shadow)}.detail-top{display:grid;grid-template-columns:66px minmax(0,1fr);gap:15px;align-items:start}.detail-icon{width:66px;aspect-ratio:1;display:grid;place-items:center;border-radius:18px;font-size:32px}.detail-category{margin:2px 0 5px;font-size:11px;font-weight:800;letter-spacing:.1em}.detail-name{margin:0;font-size:21px;line-height:1.3;letter-spacing:-.02em;color:var(--text)}.detail-desc{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.section{margin-top:24px}.section h3{margin:0 0 10px;font-size:14px;color:var(--text)}#imageSection{display:none}#imageSection.show{display:block}#detailImage{width:100%;display:block;border:1px solid var(--line);border-radius:16px;background:#f4f5fa}
.launch-list{display:grid;gap:9px}.launch-btn{width:100%;min-height:49px;padding:13px 14px;border:0;border-radius:15px;color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 20px rgba(0,0,0,.14)}.launch-btn.sub{background:#f4f5fb!important;color:var(--text)!important;box-shadow:none;border:1px solid var(--line)}
.share-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sub-btn{min-height:45px;padding:10px 11px;border:0;border-radius:14px;background:#f4f5fb;color:var(--text);font-size:13px;font-weight:800;cursor:pointer}.info-box{margin-top:24px;padding-top:16px;border-top:1px solid var(--line)}.info-box summary{cursor:pointer;color:#3d4864;font-size:13px;font-weight:800}.info-content{display:grid;gap:13px;margin-top:15px}.info-row{display:grid;gap:3px}.info-label{color:var(--muted);font-size:11px;font-weight:800}.info-value,.info-link{overflow-wrap:anywhere;color:var(--text);font-size:12px;line-height:1.6}.info-link{color:#5b3df5;text-decoration:none}
footer{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding:15px 3px 3px;color:#a7aec2;font-size:11px;font-weight:800}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:100;max-width:calc(100vw - 32px);padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#242c42;color:#fff;font-size:12px;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:.18s ease;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (hover:hover){.app-item:hover{transform:translateY(-1px);box-shadow:0 16px 30px rgba(31,41,64,.1)}.quick-btn:hover{filter:brightness(1.04)}}@media (min-width:700px){.shell{padding-left:26px;padding-right:26px}.app-list{grid-template-columns:1fr 1fr}.detail-card{padding:26px}}
</style>
</head>
<body>
<div class="shell">
<header><div><p class="brand-small">MY APPLICATION COLLECTION</p><h1>cnation(문명국) app</h1></div><button id="homeButton" class="header-home" type="button" aria-label="홈으로">⌂</button></header>
<main id="homeView" class="active"><p class="intro">직접 만든 앱들을 한곳에서 확인하고 실행할 수 있습니다.<br>블로그 : <a href="https://cnation.tistory.com" target="_blank" rel="noopener noreferrer">cnation.tistory.com</a> , 이메일 : <a href="mailto:mmk75@naver.com">mmk75@naver.com</a><br>작사/작곡 CCM 유투브 채널 : <a href="https://www.youtube.com/@grace2melody" target="_blank" rel="noopener noreferrer">@grace2melody</a></p><div class="search-area"><input id="searchInput" type="search" placeholder="앱 이름 또는 설명 검색" autocomplete="off"></div><div class="info-banner"><span class="dot">i</span><span>실행하기를 누르면 전체화면으로 앱이 열립니다.</span></div><div id="categoryArea"></div><div id="emptyState" class="empty">검색 결과가 없습니다.</div></main>
<main id="detailView"><button id="backButton" class="back-btn" type="button">← 목록으로</button><section class="detail-card"><div class="detail-top"><div id="detailIcon" class="detail-icon"></div><div><p id="detailCategory" class="detail-category"></p><h2 id="detailName" class="detail-name"></h2><p id="detailDesc" class="detail-desc"></p></div></div><section id="imageSection" class="section"><h3>Screenshot</h3><img id="detailImage" alt=""></section><section class="section"><h3>실행</h3><div id="launchList" class="launch-list"></div></section><section class="section"><h3>공유</h3><div class="share-row"><button id="shareButton" class="sub-btn" type="button">공유하기</button><button id="copyButton" class="sub-btn" type="button">기본 링크 복사</button></div></section><details class="info-box"><summary>App Information / 전체 링크</summary><div id="infoContent" class="info-content"></div></details></section></main>
<footer><span>CNATION</span><span>Version 1.0.0</span></footer>
</div><div id="toast" class="toast"></div>
<script src="./app-data.js"></script>
<script>
const PALETTE=[
  {bg:'#ffe1e6',fg:'#e0355f',g1:'#f0587c',g2:'#d63a63'},
  {bg:'#d9f7e6',fg:'#159a5c',g1:'#43c98a',g2:'#149c62'},
  {bg:'#fff3d6',fg:'#c9860a',g1:'#f6b93b',g2:'#e0930f'},
  {bg:'#ffe3d1',fg:'#d85f14',g1:'#fb923c',g2:'#ea580c'},
  {bg:'#dbeafe',fg:'#1d4ed8',g1:'#60a5fa',g2:'#2563eb'},
  {bg:'#e6e0fb',fg:'#6d28d9',g1:'#9161f5',g2:'#6d28d9'},
  {bg:'#d7f5f0',fg:'#0d9488',g1:'#2dd4bf',g2:'#0d9488'}
];
function accentFor(app){const i=APP_DATA.indexOf(app);return PALETTE[(i<0?0:i)%PALETTE.length]}
const $=id=>document.getElementById(id);const homeView=$('homeView'),detailView=$('detailView'),categoryArea=$('categoryArea'),searchInput=$('searchInput'),emptyState=$('emptyState'),backButton=$('backButton'),homeButton=$('homeButton'),detailIcon=$('detailIcon'),detailCategory=$('detailCategory'),detailName=$('detailName'),detailDesc=$('detailDesc'),imageSection=$('imageSection'),detailImage=$('detailImage'),launchList=$('launchList'),shareButton=$('shareButton'),copyButton=$('copyButton'),infoContent=$('infoContent'),toast=$('toast');let currentApp=null,toastTimer=null;
function safe(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function normalize(v){return String(v??'').toLowerCase().trim()}function showToast(m){clearTimeout(toastTimer);toast.textContent=m;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}function getAppId(app){return encodeURIComponent(app.name)}function findAppById(id){return APP_DATA.find(app=>getAppId(app)===id)}
function renderHome(keyword=''){categoryArea.innerHTML='';const query=normalize(keyword);let totalVisible=0;CATEGORY_ORDER.forEach(categoryName=>{const apps=APP_DATA.filter(app=>app.category===categoryName&&(!query||normalize(app.name+' '+app.desc+' '+app.category).includes(query)));if(!apps.length)return;totalVisible+=apps.length;const category=document.createElement('section');category.className='category';const title=document.createElement('h2');title.className='category-title';title.innerHTML=`<span>${CATEGORY_ICON[categoryName]||'📱'}</span><span>${safe(categoryName)}</span>`;const list=document.createElement('div');list.className='app-list';apps.forEach(app=>{const accent=accentFor(app);const item=document.createElement('div');item.className='app-item';const main=document.createElement('button');main.type='button';main.className='app-main';main.innerHTML=`<span class="app-icon" style="background:${accent.bg};color:${accent.fg}">${safe(app.icon||'📱')}</span><span class="app-text"><span class="app-name">${safe(app.name)}</span><span class="app-desc">${safe(app.desc)}</span></span><span class="arrow">›</span>`;main.addEventListener('click',()=>openApp(app));const launchRow=document.createElement('div');launchRow.className='launch-row';const extraVersions=(Array.isArray(app.versions)?app.versions.filter(v=>v?.url):[]).slice(0,1);if(app.main){const b=document.createElement('button');b.type='button';b.className='quick-btn';b.style.background=`linear-gradient(135deg,${accent.g1},${accent.g2})`;b.innerHTML='🚀 실행하기';b.addEventListener('click',()=>goToUrl(app.main));launchRow.appendChild(b)}extraVersions.forEach(version=>{const b=document.createElement('button');b.type='button';b.className='quick-btn outline';b.style.color=accent.g2;b.textContent=version.name||'다른 버전';b.addEventListener('click',()=>goToUrl(version.url));launchRow.appendChild(b)});if(app.homeShortcut&&app.main){const b=document.createElement('button');b.type='button';b.className='quick-btn outline';b.style.color=accent.g2;b.innerHTML='🏠+ 바로가기';b.addEventListener('click',()=>goToUrlPlain(addHomeParam(app.main)));launchRow.appendChild(b)}launchRow.style.gridTemplateColumns=`repeat(${launchRow.children.length},1fr)`;item.append(main,launchRow);list.appendChild(item)});category.append(title,list);categoryArea.appendChild(category)});emptyState.classList.toggle('show',totalVisible===0)}
function openApp(app,updateHistory=true){currentApp=app;const accent=accentFor(app);detailIcon.textContent=app.icon||'📱';detailIcon.style.background=accent.bg;detailIcon.style.color=accent.fg;detailCategory.textContent=app.category||'';detailCategory.style.color=accent.fg;detailName.textContent=app.name||'';detailDesc.textContent=app.desc||'';if(app.image){detailImage.src=app.image;detailImage.alt=app.name+' screenshot';imageSection.classList.add('show')}else{detailImage.removeAttribute('src');detailImage.alt='';imageSection.classList.remove('show')}renderLaunchButtons(app,accent);renderInformation(app);homeView.classList.remove('active');detailView.classList.add('active');homeButton.classList.add('show');window.scrollTo(0,0);if(updateHistory)history.pushState({app:getAppId(app)},'', '#'+getAppId(app))}
function goToUrl(url){const request=document.documentElement.requestFullscreen?.()||document.documentElement.webkitRequestFullscreen?.();if(request&&typeof request.then==='function'){request.then(()=>{location.href=url}).catch(()=>{location.href=url})}else{location.href=url}}
function goToUrlPlain(url){location.href=url}
function addHomeParam(url){try{const u=new URL(url);u.searchParams.set('addHome','1');return u.toString()}catch{return url+(url.includes('?')?'&':'?')+'addHome=1'}}
function renderLaunchButtons(app,accent){launchList.innerHTML='';if(app.main){const b=document.createElement('button');b.type='button';b.className='launch-btn';b.style.background=`linear-gradient(135deg,${accent.g1},${accent.g2})`;b.textContent='🚀 기본 버전 실행';b.addEventListener('click',()=>goToUrl(app.main));launchList.appendChild(b)}if(Array.isArray(app.versions)){app.versions.forEach(version=>{if(!version?.url)return;const b=document.createElement('button');b.type='button';b.className='launch-btn sub';b.textContent=version.name||'다른 버전';b.addEventListener('click',()=>goToUrl(version.url));launchList.appendChild(b)})}if(app.homeShortcut&&app.main){const b=document.createElement('button');b.type='button';b.className='launch-btn sub';b.textContent='🏠+ 바로가기 만들기';b.addEventListener('click',()=>goToUrlPlain(addHomeParam(app.main)));launchList.appendChild(b)}}
function addInfo(label,value,isLink=false){if(!value)return;const row=document.createElement('div');row.className='info-row';const l=document.createElement('span');l.className='info-label';l.textContent=label;const v=document.createElement(isLink?'a':'span');v.className=isLink?'info-link':'info-value';v.textContent=value;if(isLink){v.href=value;v.target='_blank';v.rel='noopener noreferrer'}row.append(l,v);infoContent.appendChild(row)}function renderInformation(app){infoContent.innerHTML='';addInfo('Category',app.category);addInfo('Primary URL',app.main,true);addInfo('Backup URL',app.backup,true);if(Array.isArray(app.versions))app.versions.forEach(v=>addInfo(v.name||'Version',v.url,true));addInfo('Remark',app.remark)}
function showHome(updateHistory=true){currentApp=null;detailView.classList.remove('active');homeView.classList.add('active');homeButton.classList.remove('show');window.scrollTo(0,0);if(updateHistory)history.pushState({},'',location.pathname+location.search)}
shareButton.addEventListener('click',async()=>{if(!currentApp)return;const text=currentApp.name+'\n'+currentApp.desc;try{if(navigator.share)await navigator.share({title:currentApp.name,text,url:currentApp.main});else{await navigator.clipboard.writeText(text+'\n'+currentApp.main);showToast('공유 내용을 복사했습니다.')}}catch(e){if(e?.name!=='AbortError')showToast('공유 기능을 사용할 수 없습니다.')}});copyButton.addEventListener('click',async()=>{if(!currentApp?.main)return;try{await navigator.clipboard.writeText(currentApp.main);showToast('기본 링크를 복사했습니다.')}catch{showToast('링크 복사에 실패했습니다.')}});searchInput.addEventListener('input',()=>renderHome(searchInput.value));backButton.addEventListener('click',()=>location.hash?history.back():showHome());homeButton.addEventListener('click',()=>showHome());window.addEventListener('popstate',()=>{const hash=location.hash.replace('#','');if(hash){const app=findAppById(hash);if(app){openApp(app,false);return}}currentApp=null;detailView.classList.remove('active');homeView.classList.add('active');homeButton.classList.remove('show');window.scrollTo(0,0)});
renderHome();const initialHash=location.hash.replace('#','');if(initialHash){const app=findAppById(initialHash);if(app)openApp(app,false)}
</script>
</body>
</html>
