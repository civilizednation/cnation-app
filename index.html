<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0f17">
<title>cnation app</title>
<style>
:root{--bg:#0b0f17;--panel:#131b29;--panel2:#192437;--line:rgba(255,255,255,.09);--text:#f5f7fb;--muted:#9ba8ba;--blue:#6fa7ff;--radius:18px;--shadow:0 16px 38px rgba(0,0,0,.24)}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--text);background:radial-gradient(circle at 100% 0%,rgba(61,132,255,.15),transparent 360px),var(--bg);font-family:"Malgun Gothic","맑은 고딕",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{-webkit-tap-highlight-color:transparent}.shell{width:min(100%,820px);min-height:100vh;margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 16px max(22px,env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.brand-small{margin:0 0 4px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.13em}h1{margin:0;font-size:30px;line-height:1.1;letter-spacing:-.03em}.header-home{display:none;width:42px;height:42px;border:1px solid var(--line);border-radius:14px;background:var(--panel);color:var(--text);cursor:pointer;font-size:19px}.header-home.show{display:grid;place-items:center}
#homeView{display:none}#homeView.active{display:block}#detailView{display:none}#detailView.active{display:block}.intro{margin:0 0 15px;color:var(--muted);font-size:14px;line-height:1.6}.search-area{position:sticky;top:max(8px,env(safe-area-inset-top));z-index:10;margin-bottom:22px}#searchInput{width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:15px;outline:none;background:rgba(19,27,41,.93);color:var(--text);box-shadow:0 8px 24px rgba(0,0,0,.18);backdrop-filter:blur(14px)}#searchInput::placeholder{color:#748096}.category{margin-bottom:25px}.category-title{display:flex;align-items:center;gap:8px;margin:0 0 9px;color:#dce6f6;font-size:13px;font-weight:800;letter-spacing:.08em}.app-list{display:grid;gap:9px}.app-item{width:100%;display:grid;grid-template-columns:50px minmax(0,1fr) 18px;gap:12px;align-items:center;padding:11px 12px;border:1px solid var(--line);border-radius:17px;background:linear-gradient(180deg,#192334,#121a28);color:var(--text);text-align:left;cursor:pointer;box-shadow:0 8px 20px rgba(0,0,0,.12);transition:.14s ease}.app-item:active{transform:scale(.985)}.app-icon{width:50px;aspect-ratio:1;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#25344e,#151d2d);font-size:26px}.app-text{min-width:0}.app-name{display:block;margin-bottom:4px;font-size:15px;font-weight:800;line-height:1.35}.app-desc{display:-webkit-box;overflow:hidden;color:var(--muted);font-size:12px;line-height:1.5;-webkit-line-clamp:2;-webkit-box-orient:vertical}.arrow{color:#6f7c8f;font-size:22px}.empty{display:none;padding:28px 16px;border:1px dashed var(--line);border-radius:17px;color:var(--muted);text-align:center;font-size:14px}.empty.show{display:block}
.back-btn{margin:0 0 12px;padding:7px 0;border:0;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.detail-card{padding:18px;border:1px solid var(--line);border-radius:22px;background:rgba(19,27,41,.94);box-shadow:var(--shadow)}.detail-top{display:grid;grid-template-columns:70px minmax(0,1fr);gap:15px;align-items:start}.detail-icon{width:70px;aspect-ratio:1;display:grid;place-items:center;border-radius:19px;background:linear-gradient(145deg,#293a56,#151e2e);font-size:34px}.detail-category{margin:2px 0 5px;color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.1em}.detail-name{margin:0;font-size:22px;line-height:1.3;letter-spacing:-.02em}.detail-desc{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.7}.section{margin-top:25px}.section h3{margin:0 0 10px;font-size:14px}#imageSection{display:none}#imageSection.show{display:block}#detailImage{width:100%;display:block;border:1px solid var(--line);border-radius:16px;background:#0f1520}.launch-list{display:grid;gap:9px}.launch-btn{width:100%;min-height:49px;padding:13px 14px;border:0;border-radius:15px;background:linear-gradient(180deg,#4c93ff,#3176e7);color:#fff;font-weight:800;cursor:pointer;box-shadow:0 10px 22px rgba(61,132,255,.20)}.launch-btn.sub{background:linear-gradient(180deg,#26364f,#1b273a);box-shadow:none}.share-row{display:grid;grid-template-columns:1fr 1fr;gap:9px}.sub-btn{min-height:45px;padding:10px 11px;border:0;border-radius:14px;background:var(--panel2);color:var(--text);font-size:13px;font-weight:800;cursor:pointer}.info-box{margin-top:25px;padding-top:17px;border-top:1px solid var(--line)}.info-box summary{cursor:pointer;color:#d3ddec;font-size:13px;font-weight:800}.info-content{display:grid;gap:13px;margin-top:15px}.info-row{display:grid;gap:3px}.info-label{color:var(--muted);font-size:11px;font-weight:800}.info-value,.info-link{overflow-wrap:anywhere;color:var(--text);font-size:12px;line-height:1.6}.info-link{color:#91b9ff;text-decoration:none}footer{display:flex;justify-content:space-between;gap:10px;margin-top:26px;padding:15px 3px 3px;color:#5f6b7c;font-size:11px;font-weight:800}.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));z-index:100;max-width:calc(100vw - 32px);padding:10px 14px;border:1px solid var(--line);border-radius:999px;background:#202c40;color:#fff;font-size:12px;opacity:0;pointer-events:none;transform:translate(-50%,16px);transition:.18s ease;box-shadow:var(--shadow)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media (hover:hover){.app-item:hover{transform:translateY(-1px);border-color:rgba(111,167,255,.38)}}@media (min-width:700px){.shell{padding-left:26px;padding-right:26px}.app-list{grid-template-columns:1fr 1fr}.detail-card{padding:24px}}
</style>
</head>
<body>
<div class="shell">
<header><div><p class="brand-small">MY APPLICATION COLLECTION</p><h1>cnation app</h1></div><button id="homeButton" class="header-home" type="button" aria-label="홈으로">⌂</button></header>
<main id="homeView" class="active"><p class="intro">직접 만든 앱들을 한곳에서 확인하고 실행할 수 있습니다.</p><div class="search-area"><input id="searchInput" type="search" placeholder="앱 이름 또는 설명 검색" autocomplete="off"></div><div id="categoryArea"></div><div id="emptyState" class="empty">검색 결과가 없습니다.</div></main>
<main id="detailView"><button id="backButton" class="back-btn" type="button">← 목록으로</button><section class="detail-card"><div class="detail-top"><div id="detailIcon" class="detail-icon"></div><div><p id="detailCategory" class="detail-category"></p><h2 id="detailName" class="detail-name"></h2><p id="detailDesc" class="detail-desc"></p></div></div><section id="imageSection" class="section"><h3>Screenshot</h3><img id="detailImage" alt=""></section><section class="section"><h3>실행</h3><div id="launchList" class="launch-list"></div></section><section class="section"><h3>공유</h3><div class="share-row"><button id="shareButton" class="sub-btn" type="button">공유하기</button><button id="copyButton" class="sub-btn" type="button">기본 링크 복사</button></div></section><details class="info-box"><summary>App Information / 전체 링크</summary><div id="infoContent" class="info-content"></div></details></section></main>
<footer><span>CNATION</span><span>Version 1.0.0</span></footer>
</div><div id="toast" class="toast"></div>
<script src="./app-data.js"></script>
<script>
const $=id=>document.getElementById(id);const homeView=$('homeView'),detailView=$('detailView'),categoryArea=$('categoryArea'),searchInput=$('searchInput'),emptyState=$('emptyState'),backButton=$('backButton'),homeButton=$('homeButton'),detailIcon=$('detailIcon'),detailCategory=$('detailCategory'),detailName=$('detailName'),detailDesc=$('detailDesc'),imageSection=$('imageSection'),detailImage=$('detailImage'),launchList=$('launchList'),shareButton=$('shareButton'),copyButton=$('copyButton'),infoContent=$('infoContent'),toast=$('toast');let currentApp=null,toastTimer=null;
function safe(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function normalize(v){return String(v??'').toLowerCase().trim()}function showToast(m){clearTimeout(toastTimer);toast.textContent=m;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),1800)}function getAppId(app){return encodeURIComponent(app.name)}function findAppById(id){return APP_DATA.find(app=>getAppId(app)===id)}
function renderHome(keyword=''){categoryArea.innerHTML='';const query=normalize(keyword);let totalVisible=0;CATEGORY_ORDER.forEach(categoryName=>{const apps=APP_DATA.filter(app=>app.category===categoryName&&(!query||normalize(app.name+' '+app.desc+' '+app.category).includes(query)));if(!apps.length)return;totalVisible+=apps.length;const category=document.createElement('section');category.className='category';const title=document.createElement('h2');title.className='category-title';title.innerHTML=`<span>${CATEGORY_ICON[categoryName]||'📱'}</span><span>${safe(categoryName)}</span>`;const list=document.createElement('div');list.className='app-list';apps.forEach(app=>{const button=document.createElement('button');button.type='button';button.className='app-item';button.innerHTML=`<span class="app-icon">${safe(app.icon||'📱')}</span><span class="app-text"><span class="app-name">${safe(app.name)}</span><span class="app-desc">${safe(app.desc)}</span></span><span class="arrow">›</span>`;button.addEventListener('click',()=>openApp(app));list.appendChild(button)});category.append(title,list);categoryArea.appendChild(category)});emptyState.classList.toggle('show',totalVisible===0)}
function openApp(app,updateHistory=true){currentApp=app;detailIcon.textContent=app.icon||'📱';detailCategory.textContent=app.category||'';detailName.textContent=app.name||'';detailDesc.textContent=app.desc||'';if(app.image){detailImage.src=app.image;detailImage.alt=app.name+' screenshot';imageSection.classList.add('show')}else{detailImage.removeAttribute('src');detailImage.alt='';imageSection.classList.remove('show')}renderLaunchButtons(app);renderInformation(app);homeView.classList.remove('active');detailView.classList.add('active');homeButton.classList.add('show');window.scrollTo(0,0);if(updateHistory)history.pushState({app:getAppId(app)},'', '#'+getAppId(app))}
function goToUrl(url){const request=document.documentElement.requestFullscreen?.()||document.documentElement.webkitRequestFullscreen?.();if(request&&typeof request.then==='function'){request.then(()=>{location.href=url}).catch(()=>{location.href=url})}else{location.href=url}}
function renderLaunchButtons(app){launchList.innerHTML='';if(app.main){const b=document.createElement('button');b.type='button';b.className='launch-btn';b.textContent='기본 버전 실행';b.addEventListener('click',()=>goToUrl(app.main));launchList.appendChild(b)}if(Array.isArray(app.versions)){app.versions.forEach(version=>{if(!version?.url)return;const b=document.createElement('button');b.type='button';b.className='launch-btn sub';b.textContent=version.name||'다른 버전';b.addEventListener('click',()=>goToUrl(version.url));launchList.appendChild(b)})}}
function addInfo(label,value,isLink=false){if(!value)return;const row=document.createElement('div');row.className='info-row';const l=document.createElement('span');l.className='info-label';l.textContent=label;const v=document.createElement(isLink?'a':'span');v.className=isLink?'info-link':'info-value';v.textContent=value;if(isLink){v.href=value;v.target='_blank';v.rel='noopener noreferrer'}row.append(l,v);infoContent.appendChild(row)}function renderInformation(app){infoContent.innerHTML='';addInfo('Category',app.category);addInfo('Primary URL',app.main,true);addInfo('Backup URL',app.backup,true);if(Array.isArray(app.versions))app.versions.forEach(v=>addInfo(v.name||'Version',v.url,true));addInfo('Remark',app.remark)}
function showHome(updateHistory=true){currentApp=null;detailView.classList.remove('active');homeView.classList.add('active');homeButton.classList.remove('show');window.scrollTo(0,0);if(updateHistory)history.pushState({},'',location.pathname+location.search)}
shareButton.addEventListener('click',async()=>{if(!currentApp)return;const text=currentApp.name+'\n'+currentApp.desc;try{if(navigator.share)await navigator.share({title:currentApp.name,text,url:currentApp.main});else{await navigator.clipboard.writeText(text+'\n'+currentApp.main);showToast('공유 내용을 복사했습니다.')}}catch(e){if(e?.name!=='AbortError')showToast('공유 기능을 사용할 수 없습니다.')}});copyButton.addEventListener('click',async()=>{if(!currentApp?.main)return;try{await navigator.clipboard.writeText(currentApp.main);showToast('기본 링크를 복사했습니다.')}catch{showToast('링크 복사에 실패했습니다.')}});searchInput.addEventListener('input',()=>renderHome(searchInput.value));backButton.addEventListener('click',()=>location.hash?history.back():showHome());homeButton.addEventListener('click',()=>showHome());window.addEventListener('popstate',()=>{const hash=location.hash.replace('#','');if(hash){const app=findAppById(hash);if(app){openApp(app,false);return}}currentApp=null;detailView.classList.remove('active');homeView.classList.add('active');homeButton.classList.remove('show');window.scrollTo(0,0)});
renderHome();const initialHash=location.hash.replace('#','');if(initialHash){const app=findAppById(initialHash);if(app)openApp(app,false)}
</script>
</body>
</html>
