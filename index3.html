<!DOCTYPE html>
<html lang="ko" class="h-full">
<head>
    <meta charset="UTF-8">
    <title>cnation Hub</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style type="text/tailwindcss">
        @layer base {
            body {
                @apply font-sans bg-gray-50 text-gray-800 m-0 h-full overflow-hidden; /* Hide main scrollbar */
            }
            html {
                 @apply h-full; /* Ensure full height */
            }
            #root {
                @apply h-full flex flex-col;
            }
             /* Hide scrollbar for Webkit browsers */
            .overflow-y-auto::-webkit-scrollbar,
            .overflow-x-hidden::-webkit-scrollbar {
                display: none;
            }
            /* Hide scrollbar for Firefox */
            .overflow-y-auto,
            .overflow-x-hidden {
                scrollbar-width: none;
                -ms-overflow-style: none;
            }
        }
        @layer utilities {
            .icon-xs { @apply text-lg; }
            .icon-sm { @apply text-xl; }
            .icon-md { @apply text-2xl; }
            .icon-lg { @apply text-3xl; }
        }
    </style>
</head>
<body class="h-full">

<div id="root" class="h-full"></div>

<script type="text/babel">
    // ==========================================
    // 1. 앱 데이터 (새 앱 추가 시 이 배열만 수정하세요)
    // ==========================================
    const appsData = [
        {
            id: "cnation-4x4drum",
            name: "cnation 4x4 drum",
            description: "4x4 16개 패드 터치 리듬게임",
            category: "게임 & 오락",
            icon: "🥁",
            remark: "모바일 환경에서 가장 최적화되어 있습니다.",
            versions: [
                { label: "모바일 버전", url: "https://cnation-4x4drum.vercel.app/" },
                { label: "PC 버전 (GitHub)", url: "https://civilizednation.github.io/cnation-4x4drum/" }
            ]
        },
        {
            id: "cnation-dominion",
            name: "cnation 도미니언",
            description: "세계적으로 유명한 보드게임 도미니언을 컴퓨터와 1:1 방식으로 게임 진행",
            category: "게임 & 오락",
            icon: "🃏",
            remark: "PC 버전은 키보드와 마우스 조작에 최적화되어 있습니다.",
            versions: [
                { label: "모바일 버전", url: "https://cnation-dominion.vercel.app/" },
                { label: "PC 버전", url: "https://civilizednation.github.io/cnation-dominion/index_pc.html" }
            ]
        },
        {
            id: "cnation-jgame",
            name: "cnation 영어단어 지렁이 게임",
            description: "고전 지렁이 게임에 영어단어 맞히기를 접목한 게임",
            category: "게임 & 오락",
            icon: "🪱",
            remark: "영어/중국어 버전 및 PC 전용 버전 지원",
            versions: [
                { label: "모바일 버전", url: "https://cnation-jgame.vercel.app/" },
                { label: "PC 전용 버전", url: "https://cnation-jgame.vercel.app/index2.html" },
                { label: "중국어 버전", url: "https://civilizednation.github.io/cnation-jgame-c/" }
            ]
        },
        {
            id: "cnation-msyh-sgd",
            name: "무석연합교회 성가대 연습",
            description: "중국 우시 무석연합교회 성가대곡 연습을 도와주는 앱",
            category: "음악 & 찬양",
            icon: "🎤",
            remark: "",
            versions: [{ label: "앱 실행하기", url: "https://cnation-msyh-sgd.vercel.app/" }]
        },
        {
            id: "cnation-ccm",
            name: "cnation CCM",
            description: "내가 작사/작곡한 CCM 곡들을 한곳에서 보고, 들을 수 있게 관리해주는 앱",
            category: "음악 & 찬양",
            icon: "🎵",
            remark: "YouTube 채널 @grace2melody 와 연동됩니다.",
            versions: [
                { label: "Firebase 버전", url: "https://cnation-ccm-list.vercel.app/" },
                { label: "Supabase 버전 (Best)", url: "https://civilizednation.github.io/cnation-wuxi-ccm-list/" }
            ]
        },
        {
            id: "family-birthdays",
            name: "우리가족 일정 알림이",
            description: "가족 생일 등 주요 일정을 관리하고 D-Day 표시해주는 앱",
            category: "생활 & 알림",
            icon: "🎂",
            remark: "",
            versions: [{ label: "앱 실행하기", url: "https://cnation-family-birthdays.vercel.app/" }]
        },
        {
            id: "wuxi-dev-birthdays",
            name: "우시개발팀 생일 알림이",
            description: "중국 우시 SK하이닉스 우시개발팀 팀원들의 생일을 관리하고 D-Day 표시",
            category: "생활 & 알림",
            icon: "👥",
            remark: "",
            versions: [{ label: "앱 실행하기", url: "https://civilizednation.github.io/skhynix-wuxi-d-birthdays/" }]
        },
        {
            id: "cnation-wuxi",
            name: "명국이의 중국생활 도우미",
            description: "중국 우시생활 도우미 (집, 교회, 회사, 생활, 교통, 음식, 쇼핑...)",
            category: "도구 & 기타",
            icon: "🗺️",
            remark: "우시 생활 필수 정보 총정리",
            versions: [{ label: "앱 실행하기", url: "https://civilizednation.github.io/cnation-wuxi/" }]
        },
        {
            id: "goodmento-check",
            name: "goodmento 출석부",
            description: "문진숙(여동생) 인도 어린이집 출석부",
            category: "도구 & 기타",
            icon: "📋",
            remark: "",
            versions: [{ label: "앱 실행하기", url: "https://goodmento-school-check.vercel.app/" }]
        }
    ];

    // Helper function to group apps by category
    const groupAppsByCategory = (apps) => {
        return apps.reduce((acc, app) => {
            if (!acc[app.category]) {
                acc[app.category] = [];
            }
            acc[app.category].push(app);
            return acc;
        }, {});
    };

    // Main App Component
    const App = () => {
        const [selectedAppId, setSelectedAppId] = React.useState(null);

        const groupedApps = React.useMemo(() => groupAppsByCategory(appsData), []);

        const currentApp = React.useMemo(() => appsData.find(app => app.id === selectedAppId), [selectedAppId]);

        if (currentApp) {
            return <AppDetail app={currentApp} onBack={() => setSelectedAppId(null)} />;
        }

        return <AppList groupedApps={groupedApps} onSelectApp={(id) => setSelectedAppId(id)} />;
    };

    // Component for displaying the list of apps
    const AppList = ({ groupedApps, onSelectApp }) => {
        return (
            <div className="flex flex-col h-full">
                <header className="p-4 bg-white shadow-sm sticky top-0 z-10">
                    <h1 className="text-xl font-bold text-center">cnation Hub</h1>
                </header>
                <main className="flex-1 overflow-y-auto p-4 pb-16"> {/* Added pb-16 to account for potential footer or spacing */}
                    {Object.entries(groupedApps).map(([category, apps]) => (
                        <section key={category} className="mb-6">
                            <h2 className="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2 pl-2">{category}</h2>
                            <ul className="space-y-2">
                                {apps.map((app) => (
                                    <li key={app.id}>
                                        <button
                                            onClick={() => onSelectApp(app.id)}
                                            className="w-full flex items-center justify-between bg-white p-4 rounded-xl shadow-sm border border-gray-100 active:bg-gray-50 transition-all duration-150 ease-in-out"
                                            aria-label={`앱 ${app.name} 상세 보기`}
                                        >
                                            <div className="flex items-center space-x-3">
                                                <span className="icon-md">{app.icon}</span>
                                                <div className="text-left">
                                                    <h3 className="font-medium text-gray-900">{app.name}</h3>
                                                    <p className="text-sm text-gray-500 truncate max-w-[70%]">{app.description}</p>
                                                </div>
                                            </div>
                                            <span className="text-gray-400">›</span>
                                        </button>
                                    </li>
                                ))}
                            </ul>
                        </section>
                    ))}
                </main>
            </div>
        );
    };

    // Component for displaying app details
    const AppDetail = ({ app, onBack }) => {
        return (
            <div className="flex flex-col h-full">
                <header className="p-4 bg-white shadow-sm sticky top-0 z-10">
                    <div className="flex items-center">
                        <button
                            onClick={onBack}
                            className="mr-3 text-gray-500 hover:text-gray-800 text-xl focus:outline-none focus:ring-2 focus:ring-blue-300 rounded-full p-1"
                            aria-label="뒤로가기"
                        >
                            ‹
                        </button>
                        <h1 className="text-lg font-semibold flex items-center">
                            <span className="mr-2">{app.icon}</span>
                            {app.name}
                        </h1>
                    </div>
                </header>
                <main className="flex-1 overflow-y-auto p-4">
                    <article className="bg-white p-4 rounded-xl shadow-sm mb-4">
                        <p className="text-gray-700">{app.description}</p>
                    </article>

                    <section className="mb-4">
                        <h2 className="text-sm font-semibold text-gray-500 uppercase tracking-wider mb-2">앱 실행하기</h2>
                        <div className="space-y-2">
                            {app.versions.map((version, idx) => (
                                <a
                                    key={idx}
                                    href={version.url}
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    className="block w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white text-center rounded-lg shadow transition-colors duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2"
                                >
                                    {version.label}
                                </a>
                            ))}
                        </div>
                    </section>

                    {app.remark && (
                        <section className="mt-auto pt-4 pb-16"> {/* mt-auto pushes it down, pb-16 provides bottom space */}
                            <div className="bg-yellow-50 border-l-4 border-yellow-400 p-4">
                                <p className="text-sm text-yellow-700">
                                    <strong>Remark:</strong> {app.remark}
                                </p>
                            </div>
                        </section>
                    )}
                </main>
            </div>
        );
    };

    // Render the app
    const rootElement = document.getElementById('root');
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
</script>

</body>
</html>
